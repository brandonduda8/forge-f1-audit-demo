# Render Blueprint: Apex Forge Website Checkup ($29 self-serve audit)
# NOT DEPLOYED. Applying this blueprint is Brandon's tap (see selfserve/LAUNCH.md).
#
# Two free services:
#   apex-checkup       static site (the landing page, free check, report page). Free static sites do not sleep.
#   apex-checkup-api   Python web service (runs the checks, makes Square checkouts, verifies payments). Free plan:
#                      512 MB, sleeps after 15 min idle, ~1 min to wake. The page wakes it on load.
# Secrets are never in this file: every value marked sync: false is typed into the Render dashboard.
#
# The old one-click demo service (forge-audit-demo) was removed from this blueprint on purpose:
# it handed out the full PDF report free, which would undercut the $29 checkup. Its code is unchanged.

services:
  - type: web
    name: apex-checkup-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python selfserve/api/server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TRUST_PROXY
        value: "1"
      - key: SITE_ORIGIN            # https address of the static site, e.g. https://apex-checkup.onrender.com
        sync: false
      - key: SQUARE_ENV             # sandbox while testing, production to go live
        value: sandbox
      - key: SQUARE_ACCESS_TOKEN    # from the Square Developer Console (sandbox token first)
        sync: false
      - key: SQUARE_LOCATION_ID     # the location that takes the payments
        sync: false
      - key: SQUARE_WEBHOOK_URL     # exactly the notification URL typed into Square, e.g. https://apex-checkup-api.onrender.com/api/square/webhook
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY  # shown by Square on the webhook subscription
        sync: false
      - key: CHECKUP_PRICE_CENTS    # 2900 = $29.00 (100 for a one-dollar live test)
        value: "2900"

  - type: web
    name: apex-checkup
    runtime: static
    rootDir: selfserve/site
    # publish only the pages, never tests or notes
    buildCommand: python3 build_config.py && mkdir -p public && cp *.html *.css *.js robots.txt public/ && rm -f public/config.example.js
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: APEX_API_BASE          # https address of apex-checkup-api, e.g. https://apex-checkup-api.onrender.com
        sync: false
      - key: APEX_CHECKOUT          # "off" hides buying while you test the free check
        value: "on"
      - key: APEX_PRICE
        value: $29
      - key: APEX_SUPPORT_EMAIL     # required: where refund and privacy requests go (shown on privacy and terms pages)
        sync: false
